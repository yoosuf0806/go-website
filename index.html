<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-page <title>/<meta description>/canonical/OG + JSON-LD are injected
         here, high in <head> (right after charset/viewport and before the icon
         and font links) so the title is one of the first tags crawlers read. -->
    <!--app-head-->
    <!-- ?v= is a cache-buster: browsers hold favicons far longer than the
         1-day Cache-Control in vercel.json, so bump it on every icon change or
         visitors keep seeing the previous mark. -->
    <link rel="icon" href="/favicon.ico?v=4" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png?v=4" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=4" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
